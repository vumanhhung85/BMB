<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bảng điều khiển — Boom Music Box</title>
<link rel="icon" href="assets/logo_boombox.jpg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFD21A;--gold:#F5A11B;--purple:#8B2FBE;--grape:#4B1272;--magenta:#D633C6;
  --ink:#14061F;--plum:#1E0E33;--plum2:#2A1547;
  --line:rgba(255,210,26,.16);--line-soft:rgba(255,255,255,.09);
  --txt:#F6EEFF;--txt-dim:#B5A2CC;--txt-mute:#8B7BA5;
  --ok:#3DDC97;--warn:#FFB020;--bad:#FF5C7A;--info:#5BA9FF;
  --r:14px;--shadow:0 18px 50px -18px rgba(0,0,0,.85);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--ink);color:var(--txt);line-height:1.6;
  background-image:radial-gradient(800px 420px at 8% -10%,rgba(139,47,190,.28),transparent 60%);
  background-attachment:fixed;min-height:100vh}
h1,h2,h3{font-family:'Baloo 2',cursive;font-weight:800;line-height:1.15}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 20px;border-radius:999px;
  border:0;cursor:pointer;font-weight:600;font-size:14.5px;transition:.18s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-y{background:linear-gradient(170deg,var(--yellow),var(--gold));color:#2B1400;box-shadow:0 5px 0 #B9740A}
.btn-y:hover{transform:translateY(-2px)}
.btn-y:active{transform:translateY(2px);box-shadow:0 2px 0 #B9740A}
.btn-ok{background:linear-gradient(170deg,#3DDC97,#22A874);color:#042418;box-shadow:0 5px 0 #177953}
.btn-bad{background:rgba(255,92,122,.16);border:1px solid rgba(255,92,122,.45);color:#FFAABB}
.btn-bad:hover{background:rgba(255,92,122,.28)}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--line-soft)}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.btn-sm{padding:8px 15px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.3);
  border-top-color:currentColor;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── ĐĂNG NHẬP ── */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.loginbox{width:100%;max-width:420px;background:linear-gradient(165deg,#291444,#1B0C2F);
  border:1px solid var(--line);border-radius:24px;padding:34px 30px;box-shadow:var(--shadow)}
.loginbox img{height:64px;margin:0 auto 18px;display:block;filter:drop-shadow(0 6px 18px rgba(139,47,190,.7))}
.loginbox h1{font-size:23px;text-align:center;margin-bottom:5px}
.loginbox .sub{text-align:center;color:var(--txt-mute);font-size:13.5px;margin-bottom:24px}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--txt-dim)}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;
  background:rgba(20,6,31,.72);border:1px solid var(--line-soft);font-size:15px;transition:.18s}
.field input:focus,.field select:focus{border-color:var(--yellow);outline:none;background:rgba(20,6,31,.95)}
.msg{padding:11px 14px;border-radius:11px;font-size:13.5px;margin-bottom:14px;display:none;gap:8px}
.msg.show{display:flex}
.msg.bad{background:rgba(255,92,122,.12);border:1px solid rgba(255,92,122,.35);color:#FFAABB}
.msg.ok{background:rgba(61,220,151,.12);border:1px solid rgba(61,220,151,.35);color:#9DEBC6}
.msg.warn{background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.32);color:#FFD79A}

/* ── ỨNG DỤNG ── */
#app{display:none}
header{position:sticky;top:0;z-index:100;background:rgba(20,6,31,.9);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line-soft)}
.topbar{display:flex;align-items:center;gap:14px;height:66px}
.topbar img{height:38px}
.who{margin-left:auto;display:flex;align-items:center;gap:11px;font-size:13.5px}
.badge{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;
  background:rgba(255,210,26,.14);color:var(--yellow);border:1px solid rgba(255,210,26,.3)}
.badge.admin{background:rgba(214,51,198,.18);color:#FFA8F2;border-color:rgba(214,51,198,.4)}
.idle{font-size:11.5px;color:var(--txt-mute);display:none}
@media(min-width:640px){.idle{display:block}}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 17px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line-soft);
  cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;color:var(--txt-dim);transition:.18s}
.tab:hover{color:var(--txt)}
.tab[aria-selected="true"]{background:var(--yellow);color:#2B1400;border-color:var(--yellow);font-weight:700}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;
  background:var(--bad);color:#fff;font-size:11.5px;font-weight:700}
.tab .n.zero{display:none}
.tab[aria-selected="true"] .n{background:rgba(0,0,0,.22);color:#2B1400}

.panel{padding:22px 0 60px}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:22px}
.stat{background:linear-gradient(160deg,rgba(42,21,71,.8),rgba(30,14,51,.8));border:1px solid var(--line-soft);
  border-radius:16px;padding:16px 18px}
.stat .k{font-size:12.5px;color:var(--txt-mute);font-weight:500}
.stat .v{font-family:'Baloo 2';font-size:29px;font-weight:800;line-height:1.2;margin-top:2px}
.stat.y .v{color:var(--yellow)} .stat.g .v{color:var(--ok)} .stat.r .v{color:var(--bad)}

.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{padding:10px 14px;border-radius:999px;background:var(--plum2);
  border:1px solid var(--line-soft);font-size:14px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--yellow);outline:none}

.list{display:grid;gap:11px}
.bk{background:linear-gradient(160deg,rgba(42,21,71,.8),rgba(30,14,51,.8));border:1px solid var(--line-soft);
  border-radius:16px;padding:16px 18px;position:relative;overflow:hidden;transition:.2s}
.bk:hover{border-color:rgba(255,210,26,.3)}
.bk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--warn)}
.bk[data-s="approved"]::before{background:var(--ok)}
.bk[data-s="rejected"]::before{background:var(--bad)}
.bk[data-s="done"]::before{background:var(--info)}
.bk-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:9px}
.bk-name{font-family:'Baloo 2';font-size:18px;font-weight:700}
.bk-code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--yellow);
  background:rgba(255,210,26,.1);border:1px dashed rgba(255,210,26,.4);padding:3px 9px;border-radius:7px}
.pill-s{padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:700;vertical-align:middle}
.pill-s.pending{background:rgba(255,176,32,.16);color:var(--warn);border:1px solid rgba(255,176,32,.35)}
.pill-s.approved{background:rgba(61,220,151,.14);color:var(--ok);border:1px solid rgba(61,220,151,.35)}
.pill-s.rejected{background:rgba(255,92,122,.14);color:var(--bad);border:1px solid rgba(255,92,122,.35)}
.pill-s.done{background:rgba(91,169,255,.14);color:var(--info);border:1px solid rgba(91,169,255,.35)}
.bk-grid{display:grid;gap:6px 20px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));font-size:13.5px;margin-bottom:11px}
.bk-grid .r{display:flex;gap:7px}
.bk-grid .r i{font-style:normal;color:var(--txt-mute);min-width:66px}
.bk-note{font-size:13px;color:var(--txt-dim);background:rgba(0,0,0,.22);border-radius:10px;
  padding:9px 12px;margin-bottom:11px;border-left:2px solid var(--purple)}
.bk-act{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;padding:56px 20px;color:var(--txt-mute)}
.empty .big{font-size:44px;margin-bottom:10px}
.sk{height:112px;border-radius:16px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.1),rgba(255,255,255,.05));
  background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line-soft)}
th{color:var(--txt-mute);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
.tblwrap{overflow-x:auto;background:rgba(42,21,71,.5);border:1px solid var(--line-soft);border-radius:16px;padding:4px 14px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);z-index:2000;
  background:var(--plum2);border:1px solid var(--line);border-radius:14px;padding:13px 20px;
  box-shadow:var(--shadow);font-size:14.5px;font-weight:500;transition:transform .3s cubic-bezier(.2,.9,.3,1.3);
  max-width:calc(100vw - 32px)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:rgba(61,220,151,.5)} #toast.bad{border-color:rgba(255,92,122,.5)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- ══════════ ĐĂNG NHẬP ══════════ -->
<div id="login">
  <div class="loginbox">
    <img src="assets/logo_boombox.jpg" alt="Boom Music Box">
    <h1>Bảng điều khiển chi nhánh</h1>
    <div class="sub">Dành cho quản lý và nhân viên Boom Music Box</div>

    <div class="msg bad" id="loginMsg"><span>⚠️</span><span id="loginMsgTxt"></span></div>

    <div class="field">
      <label for="uUser">Tài khoản</label>
      <input id="uUser" autocomplete="username" placeholder="vd: hoangdieu2" autocapitalize="none" spellcheck="false">
    </div>
    <div class="field">
      <label for="uPass">Mật khẩu</label>
      <input id="uPass" type="password" autocomplete="current-password" placeholder="••••••••"
             onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-y" style="width:100%" id="loginBtn" onclick="doLogin()">Đăng nhập</button>

    <div class="msg warn show" style="margin-top:18px;font-size:12.5px">
      <span>🔒</span>
      <span>Mật khẩu được băm SHA-256 trước khi rời khỏi máy bạn. Phiên tự đóng sau 20 phút không thao tác.</span>
    </div>
    <div style="text-align:center;margin-top:16px"><a href="index.html" style="color:var(--txt-mute);font-size:13px">← Về trang chính</a></div>
  </div>
</div>

<!-- ══════════ ỨNG DỤNG ══════════ -->
<div id="app">
<header>
  <div class="wrap">
    <div class="topbar">
      <img src="assets/logo_boombox.jpg" alt="Boom">
      <div>
        <div style="font-family:'Baloo 2';font-weight:800;font-size:16px;line-height:1.2" id="hBranch">—</div>
        <div style="font-size:12px;color:var(--txt-mute)" id="hRole">—</div>
      </div>
      <div class="who">
        <span class="idle" id="idleTxt"></span>
        <span class="badge" id="hBadge">—</span>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Đăng xuất</button>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true"  data-t="pending"  onclick="switchTab(this)">Chờ duyệt <span class="n zero" id="nPending"></span></button>
      <button class="tab" role="tab" aria-selected="false" data-t="approved" onclick="switchTab(this)">Đã duyệt</button>
      <button class="tab" role="tab" aria-selected="false" data-t="done"     onclick="switchTab(this)">Đã tới hát</button>
      <button class="tab" role="tab" aria-selected="false" data-t="rejected" onclick="switchTab(this)">Từ chối</button>
      <button class="tab" role="tab" aria-selected="false" data-t="all"      onclick="switchTab(this)">Tất cả</button>
      <button class="tab" role="tab" aria-selected="false" data-t="report"   onclick="switchTab(this)">Báo cáo</button>
    </div>
  </div>
</header>

<div class="wrap panel">
  <div class="stats" id="stats"></div>

  <div class="toolbar" id="toolbar">
    <input id="qSearch" placeholder="Tìm tên, số điện thoại hoặc mã…" style="flex:1;min-width:190px" oninput="draw()">
    <select id="fBranch" onchange="draw()" style="display:none"><option value="">Tất cả chi nhánh</option></select>
    <select id="fDate" onchange="draw()">
      <option value="">Mọi ngày</option>
      <option value="today">Hôm nay</option>
      <option value="tomorrow">Ngày mai</option>
      <option value="week">7 ngày tới</option>
    </select>
    <button class="btn btn-ghost btn-sm" onclick="loadBookings(true)" id="refreshBtn">🔄 Làm mới</button>
    <button class="btn btn-ghost btn-sm" onclick="exportCSV()">⬇️ Xuất Excel</button>
  </div>

  <div class="msg warn" id="offlineMsg"><span>📴</span><span id="offlineTxt"></span></div>

  <div class="list" id="list"></div>
  <div id="report" style="display:none"></div>
</div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ══════════════════════════════════════════════
   BOOM MUSIC BOX — bảng điều khiển chi nhánh
   ══════════════════════════════════════════════ */
const CFG = {
  API: 'https://script.google.com/macros/s/AKfycbzBdcOVm0lucZJPXEE8sy5nIEztkpCaXI4TNzDd6Nks-CS1agLx8zG23v-uEEKaUQl4/exec',
  IDLE_MIN: 20,             // tự đăng xuất sau ... phút không thao tác
  PREFIX: 'bmb_adm_'
};

let SESSION = null, DATA = [], TAB = 'pending', idleTimer, idleAt;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();

function toast(m,k=''){const t=$('toast');t.textContent=m;t.className='show '+k;clearTimeout(t._t);t._t=setTimeout(()=>t.className='',4000);}
async function sha256(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function api(payload){
  if(!CFG.API) throw new Error('NO_API');
  const r = await fetch(CFG.API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({...payload, token: SESSION ? SESSION.token : ''})});
  const j = await r.json();
  if(j.error === 'BAD_TOKEN'){ logout('Phiên đã hết hạn. Đăng nhập lại nhé.'); throw new Error('BAD_TOKEN'); }
  return j;
}

/* ─── ĐĂNG NHẬP ─── */
function showLoginMsg(t){ $('loginMsgTxt').textContent = t; $('loginMsg').classList.add('show'); }

async function doLogin(){
  const u = $('uUser').value.trim().toLowerCase(), p = $('uPass').value;
  if(!u || !p) return showLoginMsg('Nhập đủ tài khoản và mật khẩu.');
  $('loginBtn').disabled = true; $('loginBtn').innerHTML = '<span class="spin"></span> Đang kiểm tra…';
  $('loginMsg').classList.remove('show');

  try{
    if(!CFG.API) throw new Error('NO_API');
    const hash = await sha256(u + '::' + p + '::boom');   // gửi hash, không gửi mật khẩu thô
    const j = await api({ action:'login', user:u, hash });
    if(!j.ok) throw new Error(
      j.error === 'BAD_LOGIN' ? 'Sai tài khoản hoặc mật khẩu.' :
      j.error === 'LOCKED'    ? 'Tài khoản tạm khoá do nhập sai nhiều lần. Thử lại sau 15 phút.' :
      'Không đăng nhập được. Thử lại sau.');
    SESSION = j.session;
    sessionStorage.setItem(CFG.PREFIX+'s', JSON.stringify(SESSION));
    enterApp();
  }catch(e){
    if(e.message === 'NO_API') showLoginMsg('Chưa cấu hình máy chủ. Mở admin.html và dán URL Apps Script vào dòng CFG.API.');
    else showLoginMsg(e.message);
  }finally{
    $('loginBtn').disabled = false; $('loginBtn').textContent = 'Đăng nhập';
  }
}

function enterApp(){
  $('login').style.display='none'; $('app').style.display='';
  $('hBranch').textContent = SESSION.branchName || 'Toàn hệ thống';
  $('hRole').textContent = SESSION.fullName || SESSION.user;
  $('hBadge').textContent = SESSION.role === 'admin' ? 'Quản trị' : 'Quản lý chi nhánh';
  $('hBadge').className = 'badge' + (SESSION.role==='admin' ? ' admin' : '');
  if(SESSION.role === 'admin') $('fBranch').style.display='';
  resetIdle();
  ['click','keydown','scroll','touchstart'].forEach(e=>document.addEventListener(e,resetIdle,{passive:true}));
  loadBookings();
  setInterval(()=>loadBookings(false,true), 60000);   // tự làm mới mỗi phút
}

function resetIdle(){
  idleAt = Date.now() + CFG.IDLE_MIN*60000;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(()=>logout('Đã đăng xuất do không thao tác 20 phút.'), CFG.IDLE_MIN*60000);
}
setInterval(()=>{
  if(!SESSION || !idleAt) return;
  const m = Math.max(0, Math.ceil((idleAt-Date.now())/60000));
  $('idleTxt').textContent = m<=5 ? 'Tự đăng xuất sau ' + m + ' phút' : '';
},20000);

function logout(reason){
  SESSION = null; DATA = []; sessionStorage.removeItem(CFG.PREFIX+'s');
  clearTimeout(idleTimer);
  $('app').style.display='none'; $('login').style.display='grid';
  $('uPass').value='';
  if(reason) showLoginMsg(reason);
}

/* ─── TẢI ĐƠN ─── */
async function loadBookings(manual, silent){
  if(!silent) $('list').innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  if(manual){ $('refreshBtn').disabled = true; $('refreshBtn').innerHTML = '<span class="spin"></span>'; }
  try{
    const j = await api({ action:'list' });
    if(j.ok){ DATA = j.data || []; $('offlineMsg').classList.remove('show'); }
    else throw new Error(j.error||'LOAD_FAIL');
  }catch(e){
    $('offlineTxt').textContent = 'Không kết nối được máy chủ. Đang hiển thị dữ liệu lần tải gần nhất.';
    $('offlineMsg').classList.add('show');
  }finally{
    if(manual){ $('refreshBtn').disabled=false; $('refreshBtn').textContent='🔄 Làm mới'; }
  }
  if(SESSION && SESSION.role === 'admin'){
    const bs=[...new Set(DATA.map(d=>d.branchName))].sort();
    $('fBranch').innerHTML='<option value="">Tất cả chi nhánh</option>'+bs.map(b=>'<option>'+esc(b)+'</option>').join('');
  }
  draw();
}

function switchTab(el){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected','false'));
  el.setAttribute('aria-selected','true');
  TAB = el.dataset.t;
  const isReport = TAB==='report';
  $('list').style.display = isReport?'none':'';
  $('report').style.display = isReport?'':'none';
  $('toolbar').style.display = isReport?'none':'flex';
  draw();
}

function filtered(){
  const q = norm($('qSearch').value.trim());
  const fb = $('fBranch').value, fd = $('fDate').value;
  const today = new Date().toISOString().slice(0,10);
  const tmr = new Date(Date.now()+864e5).toISOString().slice(0,10);
  const wk  = new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  return DATA.filter(d=>{
    if(TAB!=='all' && TAB!=='report' && d.status!==TAB) return false;
    if(fb && d.branchName!==fb) return false;
    if(fd==='today' && d.date!==today) return false;
    if(fd==='tomorrow' && d.date!==tmr) return false;
    if(fd==='week' && !(d.date>=today && d.date<=wk)) return false;
    if(q && !norm(d.name+' '+d.phone+' '+d.code+' '+d.branchName).includes(q)) return false;
    return true;
  }).sort((a,b)=> (a.date+a.startTime).localeCompare(b.date+b.startTime));
}

function draw(){
  const nP = DATA.filter(d=>d.status==='pending').length;
  $('nPending').textContent = nP || '';
  $('nPending').className = 'n' + (nP?'':' zero');
  document.title = (nP? '('+nP+') ':'') + 'Bảng điều khiển — Boom Music Box';

  const today = new Date().toISOString().slice(0,10);
  const tD = DATA.filter(d=>d.date===today);
  $('stats').innerHTML =
    '<div class="stat r"><div class="k">Chờ duyệt</div><div class="v">'+nP+'</div></div>'+
    '<div class="stat y"><div class="k">Đơn hôm nay</div><div class="v">'+tD.length+'</div></div>'+
    '<div class="stat g"><div class="k">Đã duyệt hôm nay</div><div class="v">'+tD.filter(d=>d.status==='approved').length+'</div></div>'+
    '<div class="stat"><div class="k">Khách hôm nay</div><div class="v">'+tD.filter(d=>d.status!=='rejected').reduce((s,d)=>s+(+d.guests||0),0)+'</div></div>';

  if(TAB==='report') return drawReport();

  const rows = filtered();
  $('list').innerHTML = rows.length ? rows.map(bkHTML).join('') :
    '<div class="empty"><div class="big">'+(TAB==='pending'?'✅':'📭')+'</div>'+
    '<b style="font-family:\'Baloo 2\';font-size:19px;display:block;margin-bottom:6px">'+
    (TAB==='pending'?'Không còn đơn nào chờ duyệt':'Chưa có đơn nào ở mục này')+'</b><p>'+
    (TAB==='pending'?'Đơn mới sẽ hiện ở đây và trang tự làm mới mỗi phút.':'Thử đổi bộ lọc ngày hoặc xoá từ khoá tìm kiếm.')+'</p></div>';
}

function bkHTML(d){
  const day = new Date(d.date+'T00:00:00');
  const label = {pending:'Chờ duyệt',approved:'Đã duyệt',rejected:'Từ chối',done:'Đã tới hát'}[d.status]||d.status;
  const smsOK = encodeURIComponent('Boom Music Box xac nhan giu phong '+d.code+': '+d.date+' '+d.startTime+'-'+d.endTime+', '+d.guests+' nguoi. Hen gap ban!');
  const smsNo = encodeURIComponent('Boom Music Box: rat tiec khung gio '+d.date+' '+d.startTime+' da kin. Ban chon gio khac giup minh nhe!');
  return '<article class="bk" data-s="'+esc(d.status)+'">'+
    '<div class="bk-top"><div>'+
      '<div class="bk-name">'+esc(d.name)+' <span class="pill-s '+esc(d.status)+'">'+label+'</span></div>'+
      '<div style="font-size:13px;color:var(--txt-mute)">'+esc(d.branchName)+' · gửi lúc '+esc(String(d.createdAt||'').replace('T',' ').slice(0,16))+'</div>'+
    '</div><span class="bk-code">'+esc(d.code)+'</span></div>'+
    '<div class="bk-grid">'+
      '<div class="r"><i>Ngày</i><b>'+day.toLocaleDateString('vi-VN',{weekday:'short',day:'2-digit',month:'2-digit'})+'</b></div>'+
      '<div class="r"><i>Giờ</i><b>'+esc(d.startTime)+' → '+esc(d.endTime)+'</b></div>'+
      '<div class="r"><i>Số người</i><b>'+esc(d.guests)+'</b></div>'+
      '<div class="r"><i>Điện thoại</i><b><a href="tel:'+esc(d.phone)+'" style="color:var(--yellow)">'+esc(d.phone)+'</a></b></div>'+
      (d.email?'<div class="r"><i>Email</i><b style="font-weight:500;font-size:12.5px">'+esc(d.email)+'</b></div>':'')+
    '</div>'+
    (d.note?'<div class="bk-note">💬 '+esc(d.note)+'</div>':'')+
    (d.handledBy?'<div style="font-size:12.5px;color:var(--txt-mute);margin-bottom:10px">Xử lý bởi '+esc(d.handledBy)+' · '+esc(String(d.handledAt||'').replace('T',' ').slice(0,16))+'</div>':'')+
    '<div class="bk-act">'+
      '<a class="btn btn-ghost btn-sm" href="tel:'+esc(d.phone)+'">📞 Gọi khách</a>'+
      (d.status==='pending' ?
        '<button class="btn btn-ok btn-sm" onclick="act(\''+esc(d.code)+'\',\'approved\')">✓ Duyệt</button>'+
        '<button class="btn btn-bad btn-sm" onclick="act(\''+esc(d.code)+'\',\'rejected\')">✕ Từ chối</button>' : '')+
      (d.status==='approved' ?
        '<a class="btn btn-y btn-sm" href="sms:'+esc(d.phone)+'?body='+smsOK+'">💬 Nhắn xác nhận</a>'+
        '<button class="btn btn-ghost btn-sm" onclick="act(\''+esc(d.code)+'\',\'done\')">🎤 Khách đã tới</button>' : '')+
      (d.status==='rejected' ? '<a class="btn btn-ghost btn-sm" href="sms:'+esc(d.phone)+'?body='+smsNo+'">💬 Nhắn xin lỗi</a>' : '')+
      '<a class="btn btn-ghost btn-sm" href="https://zalo.me/'+esc(d.phone)+'" target="_blank" rel="noopener">Zalo</a>'+
    '</div></article>';
}

async function act(code, status){
  const d = DATA.find(x=>x.code===code); if(!d) return;
  let reason = '';
  if(status==='rejected'){
    reason = prompt('Lý do từ chối (khách sẽ thấy trong email):', 'Khung giờ này đã kín phòng');
    if(reason === null) return;
  }
  const prev = d.status;
  d.status = status;
  d.handledBy = SESSION.fullName || SESSION.user;
  d.handledAt = new Date().toISOString();
  draw();                                              // cập nhật lạc quan
  try{
    const j = await api({ action:'update', code, status, reason });
    if(!j.ok) throw new Error(j.error||'FAIL');
    toast(status==='approved' ? 'Đã duyệt và gửi thông báo cho khách.'
        : status==='rejected' ? 'Đã từ chối và báo lại cho khách.'
        : 'Đã ghi nhận khách tới hát.','ok');
  }catch(e){
    d.status = prev; draw();
    toast('Không lưu được lên máy chủ. Kiểm tra kết nối rồi thử lại.','bad');
  }
}

/* ─── BÁO CÁO ─── */
function drawReport(){
  const byBranch = {}, byDay = {}, byStatus = {pending:0,approved:0,rejected:0,done:0};
  DATA.forEach(d=>{
    byBranch[d.branchName] = byBranch[d.branchName] || {t:0,a:0,g:0};
    byBranch[d.branchName].t++;
    if(d.status==='approved'||d.status==='done'){ byBranch[d.branchName].a++; byBranch[d.branchName].g += (+d.guests||0); }
    byDay[d.date] = (byDay[d.date]||0)+1;
    byStatus[d.status] = (byStatus[d.status]||0)+1;
  });
  const rows = Object.entries(byBranch).sort((a,b)=>b[1].t-a[1].t);
  const days = Object.entries(byDay).sort().slice(-14);
  const maxD = Math.max(1,...days.map(d=>d[1]));
  const total = DATA.length || 1;

  $('report').innerHTML =
  '<div class="stats" style="margin-bottom:24px">'+
    '<div class="stat"><div class="k">Tổng đơn</div><div class="v">'+DATA.length+'</div></div>'+
    '<div class="stat g"><div class="k">Tỉ lệ duyệt</div><div class="v">'+Math.round((byStatus.approved+byStatus.done)/total*100)+'%</div></div>'+
    '<div class="stat y"><div class="k">Tổng lượt khách</div><div class="v">'+DATA.filter(d=>d.status!=='rejected').reduce((s,d)=>s+(+d.guests||0),0)+'</div></div>'+
    '<div class="stat r"><div class="k">Bị từ chối</div><div class="v">'+byStatus.rejected+'</div></div>'+
  '</div>'+
  '<h3 style="font-size:19px;margin-bottom:12px">Đơn theo ngày (14 ngày gần nhất)</h3>'+
  '<div style="display:flex;gap:5px;align-items:flex-end;height:140px;background:rgba(42,21,71,.5);border:1px solid var(--line-soft);border-radius:16px;padding:16px;margin-bottom:26px;overflow-x:auto">'+
    (days.length ? days.map(function(e){ var d=e[0], n=e[1];
      return '<div style="flex:1;min-width:26px;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end">'+
             '<b style="font-size:11.5px;color:var(--yellow)">'+n+'</b>'+
             '<div style="width:100%;height:'+Math.max(6,n/maxD*82)+'%;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--yellow),var(--gold))" title="'+d+': '+n+' đơn"></div>'+
             '<span style="font-size:10px;color:var(--txt-mute);white-space:nowrap">'+d.slice(8)+'/'+d.slice(5,7)+'</span></div>';
    }).join('') : '<span style="color:var(--txt-mute);font-size:13.5px">Chưa có dữ liệu.</span>')+
  '</div>'+
  '<h3 style="font-size:19px;margin-bottom:12px">Xếp hạng chi nhánh</h3>'+
  '<div class="tblwrap"><table><thead><tr><th>#</th><th>Chi nhánh</th><th>Tổng đơn</th><th>Đã duyệt</th><th>Lượt khách</th><th>Tỉ lệ duyệt</th></tr></thead><tbody>'+
    (rows.length ? rows.map(function(e,i){ var b=e[0], v=e[1]; var pct=Math.round(v.a/v.t*100);
      return '<tr><td><b style="color:var(--yellow)">'+(i+1)+'</b></td><td><b>'+esc(b)+'</b></td>'+
             '<td>'+v.t+'</td><td>'+v.a+'</td><td>'+v.g+'</td>'+
             '<td><div style="display:flex;align-items:center;gap:8px">'+
             '<div style="flex:1;min-width:56px;height:6px;background:rgba(255,255,255,.09);border-radius:99px;overflow:hidden">'+
             '<div style="width:'+pct+'%;height:100%;background:var(--ok)"></div></div><span>'+pct+'%</span></div></td></tr>';
    }).join('') : '<tr><td colspan="6" style="color:var(--txt-mute);padding:24px;text-align:center">Chưa có dữ liệu.</td></tr>')+
  '</tbody></table></div>';
}

function exportCSV(){
  const rows = filtered();
  if(!rows.length) return toast('Không có dòng nào để xuất.','bad');
  const cols = ['code','branchName','date','startTime','endTime','duration','guests','name','phone','email','note','status','handledBy','handledAt','createdAt'];
  const head = ['Mã','Chi nhánh','Ngày','Bắt đầu','Kết thúc','Số giờ','Số người','Khách','Điện thoại','Email','Ghi chú','Trạng thái','Người xử lý','Lúc xử lý','Lúc đặt'];
  const csv = '\uFEFF' + [head.join(',')].concat(
    rows.map(r=>cols.map(c=>'"'+String(r[c]==null?'':r[c]).replace(/"/g,'""')+'"').join(','))
  ).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download = 'boom-donphong-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Đã xuất ' + rows.length + ' dòng.','ok');
}

/* khôi phục phiên khi tải lại tab */
(function(){
  const s = sessionStorage.getItem(CFG.PREFIX+'s');
  if(s){ try{ SESSION = JSON.parse(s); enterApp(); }catch(e){} }
})();
</script>
