<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a1466">
<meta name="robots" content="noindex">
<title>Đánh giá dịch vụ | BOOM MUSICBOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Từ 21/11/2026 trang này CHỈ còn màn hiển thị mã QR trên TV (qr.html?hien=MÃ&ten=…) — công khai, không cần đăng nhập,
     KHÔNG gọi dg_mo nên không làm tăng số lượt quét. Phần quản lý/in tem đã chuyển vào admin.html (module Đánh giá → Mã QR);
     mở trang này không kèm ?hien= sẽ được chuyển sang đó. -->
<script>if (!/[?&]hien=/.test(location.search)) location.replace('../admin.html#danhgia/qr');</script>
<style>
:root{
  --tim0:#1d0838;--tim1:#3a1466;--tim2:#5b21a6;--tim3:#7b3fbf;--tim4:#a66ee8;--tim5:#efe5fd;
  --vang:#f5b800;--vang2:#ffd54a;--vangNhat:#fff6d6;
  --nen:#f6f2fc;--the:#fff;--chu:#22163a;--phu:#6b5f80;--vien:#e6dcf5;
  --xanh:#16a34a;--do:#dc2626;--doNhat:#fdecec;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--tim0)}
[hidden]{display:none!important}
svg{display:block}
/* ── Màn hình hiển thị cho TV (?hien=MÃ) ── */
.tv{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:3vh 4vw;text-align:center;color:#fff;
  background:radial-gradient(120% 90% at 85% 0%,#8d4ad6 0%,transparent 55%),radial-gradient(90% 80% at 0% 100%,#2a0d52 0%,transparent 60%),linear-gradient(160deg,var(--tim2),var(--tim1) 55%,var(--tim0))}
.tv img{height:9vh;max-height:80px}
.tv h1{margin:0;font-size:clamp(22px,5vh,52px);letter-spacing:.04em}
.tv .vang{color:var(--vang2)}
.tv .khung{background:#fff;border-radius:3vh;padding:2.4vh;width:min(58vh,80vw);box-shadow:0 20px 70px rgba(0,0,0,.45)}
.tv .khung svg{width:100%;height:auto}
.tv .ten-tv{font-size:clamp(20px,4.4vh,46px);font-weight:700}
.tv .phu-tv{font-size:clamp(13px,2.4vh,24px);opacity:.82}

</style>
</head>
<body>
<div id="tvMan" class="tv" hidden>
  <img src="../Logo_BoomBox.png" alt="BOOM MUSICBOX">
  <h1>ĐÁNH GIÁ <span class="vang">DỊCH VỤ</span></h1>
  <div class="khung" id="tvQr"></div>
  <div class="ten-tv" id="tvTen"></div>
  <div class="phu-tv">Mở camera điện thoại, quét mã để chấm điểm và góp ý cho chúng tôi</div>
</div>
<script src="qrcode.js"></script>
<script>
(function () {
  'use strict';
  var P = new URLSearchParams(location.search);
  if (!P.get('hien')) return;
  function qrSvg(text) {
    var q = qrcode(0, 'Q'); q.addData(text); q.make();
    var n = q.getModuleCount(), d = '';
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + c + ' ' + r + 'h1v1h-1z';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges" role="img" aria-label="Mã QR"><rect width="' + n + '" height="' + n + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
  }
  var ma = String(P.get('hien')).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 20);
  document.getElementById('tvQr').innerHTML = qrSvg(new URL('./', location.href).href + '?q=' + encodeURIComponent(ma));
  document.getElementById('tvTen').textContent = P.get('ten') || '';
  document.getElementById('tvMan').hidden = false;
})();
</script>
</body>
</html>
